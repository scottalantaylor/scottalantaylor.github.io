<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scott Taylor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✶</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  :root {
    --bg: #f4f1ea;
    --ink: #221f1a;
    --muted: #6f685c;
    --accent: #b0552f;
    --line: color-mix(in oklab, var(--ink) 14%, var(--bg));
    --hover: color-mix(in oklab, var(--ink) 5%, var(--bg));
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #root { height: 100%; }

  .page {
    background: var(--bg);
    color: var(--ink);
    min-height: 100svh;
    width: 100%;
    transition: background .5s ease, color .5s ease;
  }

  /* faint paper grain */
  .page::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: .5;
    mix-blend-mode: multiply;
    background-image: radial-gradient(color-mix(in oklab, var(--ink) 4%, transparent) 0.6px, transparent 0.7px);
    background-size: 4px 4px;
  }

  .paper {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(18px, 3.4vw, 40px);
  }

  /* editorial frame */
  .page[data-frame="true"] .paper {
    margin: clamp(12px, 1.6vw, 22px);
    min-height: calc(100svh - clamp(24px, 3.2vw, 44px));
    border: 1px solid var(--line);
  }

  /* ---- top / bottom bars ---- */
  .topbar, .botbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .mark {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .mark.dim { color: var(--muted); }

  /* ---- center stage ---- */
  .stage {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: clamp(24px, 6vh, 80px) clamp(4px, 4vw, 60px);
  }

  .card {
    max-width: 600px;
    width: 100%;
  }

  .portrait {
    width: 104px; height: 104px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 color-mix(in oklab, var(--ink) 8%, transparent),
                0 18px 40px -24px color-mix(in oklab, var(--ink) 60%, transparent);
    margin-bottom: clamp(22px, 4vh, 34px);
    transform: translateY(16px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1), box-shadow .5s;
  }
  .page.ready .portrait { opacity: 1; transform: translateY(0); }
  .page.ready .portrait:hover { transform: translateY(-3px) rotate(-1deg); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.96); }

  .name {
    font-family: var(--name-font);
    font-weight: var(--name-weight);
    font-size: clamp(3.4rem, 12vw, 7rem);
    line-height: 0.92;
    letter-spacing: -0.015em;
    margin: 0;
    transform: translateY(16px);
    transition: opacity .8s ease .08s, transform .8s cubic-bezier(.2,.8,.2,1) .08s;
  }
  .page.ready .name { opacity: 1; transform: translateY(0); }

  .tag {
    font-family: var(--name-font);
    font-size: clamp(1.25rem, 3.4vw, 1.9rem);
    line-height: 1.3;
    color: var(--muted);
    margin: clamp(14px, 2.4vh, 22px) 0 clamp(34px, 6vh, 56px);
    max-width: 30ch;
    transform: translateY(16px);
    transition: opacity .8s ease .16s, transform .8s cubic-bezier(.2,.8,.2,1) .16s;
  }
  .page.ready .tag { opacity: 1; transform: translateY(0); }
  .tag .emph {
    color: var(--ink);
    font-style: italic;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat;
    background-position: 0 92%;
    background-size: 0% 1.5px;
    transition: background-size .6s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .tag .emph { background-size: 100% 1.5px; }
  .nameFont-grotesk .tag .emph { font-style: normal; }

  /* ---- links ---- */
  .links {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
    transform: translateY(16px);
    transition: opacity .8s ease .24s, transform .8s cubic-bezier(.2,.8,.2,1) .24s;
  }
  .page.ready .links { opacity: 1; transform: translateY(0); }
  .link {
    display: grid;
    grid-template-columns: 7.5rem 1fr auto;
    align-items: baseline;
    gap: 1rem;
    padding: 16px 8px 16px 4px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    position: relative;
    transition: padding-left .35s cubic-bezier(.2,.8,.2,1), background .35s;
  }
  .link::before {
    content: "";
    position: absolute; left: -4px; top: 0; bottom: 0;
    width: 2px; background: var(--accent);
    transform: scaleY(0); transform-origin: center;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .link:hover { background: var(--hover); padding-left: 16px; }
  .link:hover::before { transform: scaleY(1); }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .link-label {
    font-family: var(--name-font);
    font-size: 1.5rem;
    font-weight: var(--name-weight);
    line-height: 1;
  }
  .link-value {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .01em;
    transition: color .35s;
  }
  .link-value.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
  .link:hover .link-value { color: var(--ink); }
  .link-glyph {
    font-family: var(--mono);
    color: var(--muted);
    font-size: 15px;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), color .35s;
  }
  .link:hover .link-glyph { color: var(--accent); transform: translate(3px, -3px); }

  @media (max-width: 480px) {
    .link { grid-template-columns: 1fr auto; gap: .25rem .75rem; }
    .link-value { grid-column: 1 / -1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
